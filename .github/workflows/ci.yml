name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The type-only dev dependencies (@deepseek-ai/dsh-client-ui-*,
      # @deepseek-ai/dsh-client-store) track the dsh-0.1.2-alpha.1 API, which
      # is not yet published to npm, so package.json resolves them with
      # file:../../deepseek-harness/... — the harness checkout below must live
      # at that sibling path (two levels up, i.e. $RUNNER_WORKSPACE) and carry
      # built lib/types artifacts.
      # Once 0.1.2-alpha.1 reaches the registry, switch those entries back to
      # "^0.1.2-alpha.1" and delete this step.
      - name: Checkout DeepSeek-Harness (dsh-v0.1.2-alpha.1)
        run: |
          git clone --depth 1 --branch dsh-v0.1.2-alpha.1 \
            https://github.com/deepseek-ai/DeepSeek-Harness.git ../../deepseek-harness
          # Pin the tag to the exact release commit; fail loud if it moved.
          test "$(git -C ../../deepseek-harness rev-parse HEAD)" = "cd5ef8148158c3a752a658978873241fdf8e2bbc"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build harness lib (client type artifacts + /remote declarations)
        working-directory: ../../deepseek-harness
        # The plugin only type-imports the harness (react is the sole runtime
        # dependency), so all it needs are the built .d.ts artifacts. Those do
        # not come from `tsc -b` alone: the `./remote` export of each api package
        # resolves to lib/typert.remote-client.d.ts, which is ONLY emitted by
        # the typert generator during the tsdown host pass. A bare
        # `tsc -b <client package>` therefore fails with "Cannot find module
        # .../remote" (and the cascading `result.value is unknown` / "Property
        # 'session' does not exist" errors). `pnpm run build:lib` is the
        # canonical harness build: host tsc + host tsdown (generates /remote)
        # then client tsc + client tsdown (all client lib/types).
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
